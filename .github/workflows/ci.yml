name: main
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/cache@v4
        with:
          path: '/home/runner/work/codemirror/codemirror/node_modules'
          key: ${{ runner.os }}-modules

      - run: npm install

      - run: npm run-script build

      - run: npm test
